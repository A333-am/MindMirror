<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MindMirror AI - Reset Password</title>

    <link rel="stylesheet" href="CSS/style.css">

</head>

<body class="login-page">

    <main class="login-wrapper">

        <section class="login-container">

            <!-- Logo -->
            <div class="login-logo">

                <img src="Images/logo.png"
                     class="logo"
                     alt="MindMirror AI Logo">

            </div>


            <!-- Heading -->

            <h1>Reset Password</h1>

            <p class="login-subtitle">
                Create a new password for your account
            </p>


            <!-- New Password -->

            <div class="input-group">

                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password">

            </div>


            <!-- Confirm Password -->

            <div class="input-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password">

            </div>


            <!-- Reset Button -->

            <button
                type="button"
                class="login-button"
                id="resetPasswordBtn">

                Update Password

            </button>


            <!-- Message -->

            <p
                id="resetMessage"
                class="login-message">
            </p>


            <!-- Back to Login -->

            <div class="login-links">

                <a href="index.html">
                    ← Back to Login
                </a>

            </div>


            <!-- Wellness Message -->

            <div class="login-message">

                🌿 Your journey toward a calmer mind continues.

            </div>

        </section>

    </main>


    <script src="JS/reset-password.js"></script>

</body>

</html>
