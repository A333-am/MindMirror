<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MindMirror AI - Profile</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <!-- Header -->
    <header class="dashboard-header">

        <div class="brand">

            <img src="Images/logo.png"
                 class="logo"
                 alt="MindMirror AI Logo">

            <span>MindMirror AI</span>

        </div>

        <a href="dashboard.html" class="profile-link">
            ← Dashboard
        </a>

    </header>


    <!-- Profile -->
    <main class="profile-main">

        <section class="profile-container">

            <div class="profile-avatar">
                👤
            </div>

            <h1>My Profile</h1>

            <p class="profile-subtitle">
                Manage your personal information
            </p>


            <div class="profile-info">

                <!-- Name -->
                <div class="profile-field">

                    <label for="profileNameInput">
                        Name
                    </label>

                    <input
                        type="text"
                        id="profileNameInput"
                        value="MindMirror User"
                        disabled
                    >

                </div>


                <!-- Email -->
                <div class="profile-field">

                    <label for="profileEmailInput">
                        Email
                    </label>

                    <input
                        type="email"
                        id="profileEmailInput"
                        value="user@example.com"
                        disabled
                    >

                </div>


                <!-- Username -->
                <div class="profile-field">

                    <label for="profileUsernameInput">
                        Username
                    </label>

                    <input
                        type="text"
                        id="profileUsernameInput"
                        value="mindmirror_user"
                        disabled
                    >

                </div>

            </div>


            <!-- Buttons -->

            <div class="profile-buttons">

                <button id="editProfile">
                    ✏️ Edit Profile
                </button>

                <button id="saveProfile" style="display:none;">
                    ✅ Save Changes
                </button>

                <button id="cancelProfile" style="display:none;">
                    Cancel
                </button>

            </div>


            <p id="profileMessage"></p>

        </section>

    </main>


    <script src="JS/profile.js"></script>

</body>

</html>
