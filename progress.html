<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MindMirror AI - Progress</title>

    <link rel="stylesheet" href="CSS/style.css">

</head>

<body>

    <!-- Header -->

    <header class="dashboard-header">

        <div class="brand">

            <img src="Images/logo.png"
                 class="logo"
                 alt="MindMirror AI Logo">

            <span>MindMirror AI</span>

        </div>

        <a href="dashboard.html" class="profile-link">
            ← Dashboard
        </a>

    </header>


    <!-- Main Content -->

    <main class="progress-main">

        <section class="progress-container">

            <h1>📈 My Wellness Progress</h1>

            <p>
                Review your latest mood check-in and reflect on your progress.
            </p>


            <!-- Mood Card -->

            <div class="progress-card">

                <h2>😊 Latest Mood</h2>

                <p>
                    Mood:
                    <strong id="moodDisplay">-</strong>
                </p>

                <p>
                    Intensity:
                    <strong id="intensityDisplay">-</strong>
                </p>

                <p>
                    Date:
                    <strong id="dateDisplay">-</strong>
                </p>

            </div>


            <!-- Reflection Card -->

            <div class="progress-card">

                <h2>📝 Your Reflection</h2>

                <p id="noteDisplay">
                    No mood entry available yet.
                </p>

            </div>


            <!-- Message -->

            <p id="progressMessage"></p>

        </section>

    </main>


    <script src="JS/progress.js"></script>

</body>

</html>
