<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MindMirror AI - Forgot Password</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body class="login-page">

    <main class="login-wrapper">

        <section class="login-container">

            <!-- Logo -->
            <div class="login-logo">
                <img src="Images/logo.png"
                     class="logo"
                     alt="MindMirror AI Logo">
            </div>

            <h1>Forgot Password?</h1>

            <p class="login-subtitle">
                Reset your MindMirror account
            </p>

            <p class="login-welcome">
                Enter your username or email address and we'll
                help you recover your account.
            </p>

            <form id="forgotForm">

                <div class="input-group">

                    <label for="forgotUser">
                        Username or Email
                    </label>

                    <input
                        type="text"
                        id="forgotUser"
                        placeholder="Enter username or email"
                        required>

                </div>

                <button
                    type="submit"
                    class="login-button">
                    Reset Password
                </button>

            </form>

            <!-- Message -->
            <p id="forgotMessage"
               class="forgot-message">
            </p>

            <!-- Back -->
            <div class="login-links">

                <a href="index.html">
                    ← Back to Login
                </a>

            </div>

            <div class="login-message">
                🌿 Don't worry. You're taking a step toward getting back in.
            </div>

        </section>

    </main>

    <script src="JS/forgot-password.js"></script>

</body>

</html>
