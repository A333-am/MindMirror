<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Self-Care Reminders - MindMirror</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <!-- Header -->
    <header class="main-header">

        <div class="logo-area">
            <img src="Images/logo.png" alt="MindMirror Logo">
            <span>MindMirror</span>
        </div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
        </nav>

    </header>


    <!-- Main Content -->
    <main class="page-container">

        <div class="cbt-section">

            <h2>🌱 Self-Care Reminders</h2>

            <p>
                Add simple reminders to take care of yourself throughout the day.
            </p>


            <!-- Add Reminder -->
            <h3>📝 Add a Self-Care Reminder</h3>

            <input
                type="text"
                id="selfCareInput"
                placeholder="Enter a self-care activity"
            >

            <br><br>

            <button onclick="addSelfCareReminder()">
                ➕ Add Reminder
            </button>


            <!-- Reminder List -->
            <h3>💚 Your Self-Care Reminders</h3>

            <div id="self-care-list"></div>

        </div>

    </main>


    <!-- Self-Care JavaScript -->
    <script src="JS/self-care.js"></script>

</body>
</html>
