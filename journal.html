<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MindMirror AI - Journal</title>

    <link rel="stylesheet" href="CSS/style.css">

</head>

<body>
<header class="dashboard-header">

    <div class="brand">

        <img src="Images/logo.png"
             class="logo"
             alt="MindMirror AI Logo">

        <span>MindMirror AI</span>

    </div>

    <a href="dashboard.html" class="profile-link">
        Dashboard
    </a>

</header>


<main class="journal-main">

    <section class="journal-container">

        <h1>My Emotional Journal</h1>

        <p>
            Write about your thoughts, feelings, or experiences.
        </p>


        <div class="journal-field">

            <label for="journalTitle">
                Entry Title
            </label>

            <input
                type="text"
                id="journalTitle"
                placeholder="Give your entry a title">

        </div>


        <div class="journal-field">

            <label for="journalEntry">
                Your Thoughts
            </label>

            <textarea
                id="journalEntry"
                placeholder="Write your thoughts and feelings here...">
            </textarea>

        </div>


        <button id="saveJournal">
            Save Entry
        </button>

        <p id="journalMessage"></p>

    </section>

</main>


<script src="JS/journal.js"></script>
</body>

</html>
